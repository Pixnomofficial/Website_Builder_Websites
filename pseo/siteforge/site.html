<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading site…</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, sans-serif; background: #fff; }
    #loading, #not-found {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; color: #6b7280; text-align: center; padding: 24px;
    }
    #not-found h1 { color: #111; margin: 0 0 8px; }
    #siteFrame { width: 100%; height: 100vh; border: 0; display: block; }
    .hidden { display: none !important; }
    #theme-tag {
      position: fixed; bottom: 14px; right: 14px; z-index: 9999;
      font: 500 12px ui-monospace, monospace; background: #111; color: #fff;
      padding: 6px 12px; border-radius: 20px; opacity: 0.85; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading">Loading site…</div>

  <div id="not-found" class="hidden">
    <h1>Site not found</h1>
    <p>This link doesn't match any published site. Double-check the URL and try again.</p>
  </div>

  <iframe id="siteFrame" class="hidden" title="Website preview"></iframe>
  <div id="theme-tag" class="hidden"></div>

  <!-- 30 design templates from the Website Builder -->
  <script src="js/designs/01-modern-minimal.js"></script>
  <script src="js/designs/02-modern-dark.js"></script>

  <script src="js/designs/13-ai-startup.js"></script>
